name: Build and Deploy IT-Tools

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"  # tiap Minggu 11:00 WIB

permissions: {}

concurrency:
  group: it-tools-deploy
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/CorentinTh/it-tools.git
  SITE_DOMAIN: tools.cyphera.my.id
  UPSTREAM_DIR: build/it-tools

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4

      - name: Clone upstream IT-Tools
        run: |
          git clone --depth=1 "$UPSTREAM_REPO" "$UPSTREAM_DIR"
          git -C "$UPSTREAM_DIR" rev-parse HEAD > build/upstream-sha.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build static app
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: pnpm build

      - name: Prepare Pages output
        run: |
          SITE_DIR="$UPSTREAM_DIR/dist"
          printf "%s\n" "$SITE_DOMAIN" > "$SITE_DIR/CNAME"
          touch "$SITE_DIR/.nojekyll"

      - name: Deploy to gh-pages
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          SITE_DIR="$UPSTREAM_DIR/dist"
          cd "$SITE_DIR"
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy IT-Tools $(cat ../../build/upstream-sha.txt | head -c 7)"
          git remote add origin "git@github.com:${{ github.repository }}.git"
          git push --force origin HEAD:gh-pages